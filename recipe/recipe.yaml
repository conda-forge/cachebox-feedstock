schema_version: 1

context:
  version: "6.2.10"

package:
  name: cachebox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cachebox/cachebox-${{ version }}.tar.gz
  sha256: 13310b136aaa75558855642a5d20d9d430566d9c4dbb5e733e9b68259a5b81b6

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin ==1.14.1
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin ==1.14.1
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - cachebox
      pip_check: true

about:
  summary: The fastest caching Python library written in Rust
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/awolverp/cachebox
  repository: https://github.com/awolverp/cachebox

extra:
  recipe-maintainers:
    - synapticarbors

schema_version: 1

context:
  version: "6.1.0"

package:
  name: cachebox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cachebox/cachebox-${{ version }}.tar.gz
  sha256: 4a724aee3a9879699151604aa4773ffaad61b2bdb0a6948e6cf1bbd6d35de60c

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1.8,<2
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.8,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - cachebox
      pip_check: true

about:
  summary: The fastest caching Python library written in Rust
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/awolverp/cachebox
  repository: https://github.com/awolverp/cachebox

extra:
  recipe-maintainers:
    - synapticarbors
